services:
  - type: web
    name: can-you-hear-it-live
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn multiplayer.server:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
